server {
    listen 80 default_server;
    server_name _;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://16.28.110.84$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name 16.28.110.84;
    root /var/www/refmatch;
    index index.html;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/refmatch-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/refmatch-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /api/assistant-status {
        default_type application/json;
        return 200 '{"available":false,"provider":"static"}';
    }

    location ^~ /api/ {
        default_type application/json;
        return 503 '{"error":"Server-side features are disabled in this static deployment."}';
    }

    location ~ (^|/)\. {
        deny all;
    }

    location / {
        limit_except GET HEAD {
            deny all;
        }
        try_files $uri $uri/ =404;
    }
}
